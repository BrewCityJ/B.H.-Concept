<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cable lean line: pallet loop concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #DDE2E8; --floor: #C9D0D8; --panel: rgba(255,255,255,.94); --ink: #17202A; --muted: #556171;
  --line: #C6CDD6; --chip: #F2F4F7; --accent: #0A6BB5; --focus: #0A6BB5;
  --sans: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --cond: "Barlow Semi Condensed", "Barlow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141A20; --floor: #1F2730; --panel: rgba(27,34,42,.94); --ink: #E8EDF2; --muted: #9DAABA;
    --line: #36424E; --chip: #25303A; --accent: #4FA6E8; --focus: #4FA6E8;
  }
}
:root[data-theme="dark"] {
  --bg: #141A20; --floor: #1F2730; --panel: rgba(27,34,42,.94); --ink: #E8EDF2; --muted: #9DAABA;
  --line: #36424E; --chip: #25303A; --accent: #4FA6E8; --focus: #4FA6E8;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.45; overflow: hidden; }
#app { position: relative; width: 100%; height: 100%; }
#stage { position: absolute; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.panel { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(6px); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

#leaders { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
#labels { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.lab { position: absolute; left: 0; top: 0; width: 194px; height: 30px; padding: 3px 8px 3px 7px; display: flex; gap: 7px; align-items: center; text-align: left; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 7px; pointer-events: auto; cursor: pointer; will-change: transform; }
.lab:hover, .lab[aria-current="true"] { border-color: var(--c); box-shadow: 0 0 0 1px var(--c); }
.lab .n { flex: none; min-width: 24px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--c); color: #fff; font: 600 12px/20px var(--cond); text-align: center; margin-top: 1px; }
.lab b { display: block; font: 700 13.5px/1.2 var(--cond); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 152px; }
.lab .s { display: none; color: var(--muted); font-size: 11.5px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 148px; }
.lab > span:last-child { min-width: 0; }
#left, #info, #bar, #legend { z-index: 5; }
#left { position: absolute; top: 12px; left: 12px; bottom: 74px; width: 262px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
#left > * { pointer-events: auto; }
#title { position: static; padding: 11px 13px; flex: none; }
#title h1 { margin: 0 0 3px; font: 700 20px/1.15 var(--cond); }
#title p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.35; }
#title p + p { margin-top: 5px; font-size: 12px; }
#rail { position: static; flex: 1; min-height: 0; padding: 6px 0; overflow-y: auto; }
#rail h2 { margin: 10px 13px 3px; font: 600 14px/1.2 var(--cond); color: var(--muted); }
#rail h2:first-child { margin-top: 2px; }
.st { display: flex; align-items: center; gap: 8px; width: 100%; padding: 4px 13px; border: 0; background: none; text-align: left; }
.st:hover { background: var(--chip); }
.st[aria-current="true"] { background: var(--chip); box-shadow: inset 3px 0 0 var(--c); }
.st .n { flex: none; min-width: 28px; height: 21px; padding: 0 5px; border-radius: 11px; background: var(--c); color: #fff; font: 600 12.5px/21px var(--cond); text-align: center; }
.st .t { font-size: 13.5px; line-height: 1.2; }

#info { top: 12px; right: 12px; width: 340px; max-height: calc(100% - 96px); overflow-y: auto; padding: 14px 16px 16px; }
#info[hidden] { display: none; }
#info .top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
#info .badge { flex: none; min-width: 30px; height: 24px; padding: 0 7px; border-radius: 12px; background: var(--c); color: #fff; font: 600 14px/24px var(--cond); text-align: center; }
#info .grp { color: var(--muted); font-size: 13px; }
#info h3 { margin: 2px 0 8px; font: 700 22px/1.15 var(--cond); }
#info h4 { margin: 14px 0 3px; font: 600 14px/1.2 var(--cond); color: var(--muted); }
#info p { margin: 0 0 4px; }
#info ul { margin: 0; padding-left: 18px; }
#info li { margin: 0 0 3px; }
#info .x { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 15px; border: 1px solid var(--line); background: var(--chip); line-height: 1; font-size: 17px; }

#bar { left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; max-width: calc(100% - 24px); overflow-x: auto; }
#bar .sep { flex: none; width: 1px; background: var(--line); margin: 3px 4px; }
.btn { flex: none; border: 1px solid var(--line); background: var(--chip); border-radius: 7px; padding: 6px 11px; font: 500 14px/1.2 var(--sans); }
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:hover:not([aria-pressed="true"]) { border-color: var(--muted); }

#legend { right: 12px; bottom: 74px; padding: 9px 12px; font-size: 13px; }
#legend div { display: flex; align-items: center; gap: 8px; margin: 2px 0; }
#legend i { flex: none; width: 11px; height: 11px; border-radius: 3px; background: var(--c); }
#railToggle { display: none; }

@media (max-width: 900px) {
  #left { bottom: auto; right: 12px; width: auto; max-height: calc(100% - 140px); }
  #rail { display: none; flex: none; max-height: 52vh; }
  #rail.open { display: block; }
  #railToggle { display: inline-block; }
  #legend { display: none; }
  #title p { display: none; }
  #info { top: auto; bottom: 66px; left: 12px; right: 12px; width: auto; max-height: 44%; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
.clean #left, .clean #bar, .clean #legend, .clean #info { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="stage" aria-label="3D concept layout of the cable lean line"></div>

  <svg id="leaders" aria-hidden="true"></svg>
  <div id="labels"></div>

  <div id="left">
    <header id="title" class="panel">
      <h1>Cable lean line, pallet loop concept</h1>
      <p>Drag to orbit, scroll to zoom, click any station or label.</p>
      <p>Concept only. Sizes and positions are approximate until the reach, cycle and bend-radius studies are done.</p>
    </header>
    <nav id="rail" class="panel" aria-label="Stations"></nav>
  </div>

  <aside id="info" class="panel" hidden aria-live="polite"></aside>

  <div id="legend" class="panel" aria-label="Color key"></div>

  <div id="bar" class="panel" role="toolbar" aria-label="View controls">
    <button class="btn" id="railToggle" aria-pressed="false">Stations</button>
    <button class="btn" data-view="overview">Overview</button>
    <button class="btn" data-view="armor">Armor side</button>
    <button class="btn" data-view="top">Top</button>
    <span class="sep"></span>
    <button class="btn" id="labelsBtn" aria-pressed="true">Labels: full</button>
    <button class="btn" data-tog="guard" aria-pressed="false">Guarding</button>
    <button class="btn" data-tog="lane" aria-pressed="true">Armor lane</button>
    <button class="btn" data-tog="duct" aria-pressed="true">Exhaust</button>
    <span class="sep"></span>
    <button class="btn" id="play" aria-pressed="true">Pallets moving</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
'use strict';

/* ------------------------------------------------------------------ data */
var GC = {
  armor:   { c: 0xD9732B, name: 'Armor lane' },
  prep:    { c: 0x3D9B66, name: 'Cable prep' },
  female:  { c: 0x1F6FB5, name: 'Female end' },
  trim:    { c: 0x7B5FC4, name: 'Trim and test' },
  male:    { c: 0x14909E, name: 'Male end' },
  finish:  { c: 0xB8467C, name: 'Label and pack' },
  support: { c: 0x8C7A4F, name: 'Support systems' }
};
function hex(c) { return '#' + ('000000' + c.toString(16)).slice(-6); }

var STATIONS = [
 { id:'A1', num:'A1', name:'Armor feed, measure and cut', g:'armor', section:'Armor lane (parallel path)', tag:'SST armor, cut to length',
   handles:'Stainless armor from the spool in three types: uncoated, FEP-coated and PFA-coated high-temp. It is measured and cut to the length on the work order. Splices, holes, weld blockages and torn jackets are rejected.',
   equip:['Carpenter M60-class feeder with M59 pre-feeder (both on the Baker Hughes list), controlled over EtherNet/IP or I/O (assumed)','Automated saw or shear in place of today’s manual bandsaw. This is a deviation from the list, so the proposal states the reason'],
   manual:'14 s to cut armor to length',
   notes:['Armor length is cable length minus about 0.3 m, ±0.05 m','Closed-loop length measurement replaces today’s belt-slip “adjusted length” table'] },
 { id:'A2', num:'A2', name:'Armor ferrule crimp and pull test', g:'armor', section:'Armor lane (parallel path)', tag:'Ferrule and 10 lb pull test',
   handles:'A one-piece 304 stainless ferrule (167592, about 0.12 × 0.26 in) is bowl-fed onto the cut end and crimped from the outside, then pulled to 10 lb. A ferrule that fails is replaced.',
   equip:['Bowl feeder with orientation and camera check','Crimp head and pull tester. Crimp only, no weld'],
   manual:'Inside the 76 s ferrule, cable cut and stuffing step',
   notes:['The armor standard also shows a weld method. It is excluded here'] },
 { id:'A3', num:'A3', name:'Cable stuffing', g:'armor', section:'Armor lane (parallel path)', tag:'Cable pushed through armor',
   handles:'Cable from the spool is pushed through the full length of armor and cut to length. Splices in the cable are detected and removed.',
   equip:['Carpenter M970-class cable dispenser, EtherNet/IP or I/O (assumed)','Keyence IG1000 splice detector'],
   manual:'76 s, shared with the first ferrule step',
   notes:['Needs the straight armor lane so the cable feeds through with only one large bend','Cable comes from the same spool wall as station 1'] },
 { id:'A4', num:'A4', name:'Armor lane', g:'armor', section:'Armor lane (parallel path)', tag:'Straight lane, one bend',
   handles:'Holds the full-length armor straight while the cable is fed through, like today’s “trombone” trough. The longest armor is about 500 in (41.7 ft), for a 13 m cable.',
   equip:['Supported trough along the west wall, passing the pillar','One large-radius bend at the south end, then a short return leg. Lane length from the cable dispenser is about 43 ft'],
   manual:'Replaces the manual trombone',
   notes:['43 ft against a 41.7 ft armor is tight. The minimum bend radius of the armor and cable is still needed to confirm the fit','Uses the 3 ft strip beside the pillar'] },
 { id:'A5', num:'A5', name:'Armored cable wind-on', g:'armor', section:'x', tag:'Armored cable wound on pallet',
   handles:'The finished armor-and-cable assembly is drawn from the head of the lane onto a pallet and wound, like the coiler at the head of the armor line today. Both ends go into the pallet grippers. This is where armored cable enters the loop.',
   equip:['Pallet winder with a guide funnel at the lane head','Transfer robot to pass the assembly to the grippers'],
   manual:'21 s to coil and tie',
   notes:['Armored cable is stiff, so the coil size depends on the armor bend radius','Armored cable skips cut and coil (station 1)'] },
 { id:'A6', num:'A6', name:'Armor far-end ferrule', g:'armor', section:'x', tag:'2nd ferrule, 10 lb pull test',
   handles:'At the far end of the lane, after the cable comes out of the armor, the second ferrule is crimped and pulled to 10 lb. The gantry parks at the far end of whatever armor length is running.',
   equip:['Transfer gantry on a rail beside the lane','Ferrule feeder, crimp head and pull tester'],
   manual:'8 s for the second ferrule and pull test',
   notes:['The far end moves with armor length, so this station travels on a rail'] },

 { id:'1', num:'1', name:'Cut and coil', g:'prep', section:'x', tag:'Start: spool cable, cut, coil',
   handles:'Start of the unarmored path. Cable of the type on the work order comes from the spool wall, is cut to the table length (for example 186 in for a 4.0 m cable) and wound onto the pallet with both ends held in the grippers.',
   equip:['Eco-Strip 9380-class cutter (vendor list) for cut length','Keyence IG1000 splice detector, bank set by cable type','Cable arrives from the spool wall through a selector'],
   manual:'16 s to cut, coil and tie',
   notes:['Cut length carries extra for strip and trim','Armored cable skips this station'] },
 { id:'2', num:'2', name:'Female end strip and inspect', g:'female', section:'Pallet loop, west side', tag:'Strip end, camera check',
   handles:'Strips the first end to the lengths on the cable prep drawing. A camera checks for frayed or uncut braid and for cuts that go too deep.',
   equip:['Nitronic ST730-class stripper (vendor list) with triax and coax programs','Camera inspection of the strip'],
   manual:'50 s for stations 2 to 5 together (strip, shrink and female connector)',
   notes:['Triax has an extra braid layer, so it needs its own strip program'] },
 { id:'3', num:'3', name:'Heat shrink, protector and lube', g:'female', section:'Pallet loop, west side', tag:'Shrink, boot and lube',
   handles:'Places everything that has to go on before the connector: color-coded shrink (1 in, or 2 in for high-temp), clear customer shrink, slit shrink (blue for FluidLoc, green for high-temp), and the silicone connector protector with a dab of lube.',
   equip:['Cut-to-length shrink dispensers for clear small and large, five colors and two slit colors','Protector feeder for standard and NSV, plus a lube dispenser'],
   manual:'Inside the 50 s female-end step',
   notes:['The SOW and the work instruction differ on which shrink goes on which end. To be confirmed','This adds up to 8 to 10 shrink part numbers'] },
 { id:'4', num:'4', name:'Female pin crimp', g:'female', section:'Pallet loop, west side', tag:'Center pin onto conductor',
   handles:'Crimps the female center pin (100M1005) onto the center conductor. A camera checks the pin is fully seated with no gap.',
   equip:['Z&F CR03-class pin crimper, female head (vendor list)','Pin bowl feeder'],
   manual:'Inside the 50 s female-end step',
   notes:['Male and female pins are different parts, so each end has its own crimp station'] },
 { id:'5', num:'5', name:'Female connector and ferrule', g:'female', section:'Pallet loop, west side', tag:'Robot: connector + ferrule',
   handles:'A robot slides the gold ferrule onto the cable, flares the coax braid, snaps the female connector (00500127) over the pin, slides the ferrule over the braid and crimps it. FluidLoc and high-temp cables get slit shrink behind the ferrule.',
   equip:['Small 6-axis robot with braid-flare and ferrule tools','AMP-class pneumatic crimper (vendor list)','Connector and ferrule bowl feeders'],
   manual:'Inside the 50 s female-end step',
   notes:['This is the hardest step to automate. Proven commercial methods are still being reviewed','On armored cable the female connector goes on the short end at the armor'] },
 { id:'6', num:'6', name:'Female pull test', g:'female', section:'Pallet loop, west side', tag:'25 lb proof pull',
   handles:'Pulls the connector to 25 lb. A connector that fails is replaced and retested. A second failure cuts off the stripped end so it can be re-stripped and rebuilt.',
   equip:['Load-cell pull tester'],
   manual:'Part of the 71 s pull test and trim step',
   notes:['The cable drawing cites other pull specs by cable type (144979, 161984, 173973). Loads to be confirmed'] },
 { id:'7', num:'7', name:'Reject and re-entry', g:'finish', section:'Pallet loop, west side', tag:'Failed out, rework back in',
   handles:'Takes failed or interrupted cables out of the loop, shows the error, records the failure and starts a corrective work order. After an operator checks a cable, it goes back into the loop here.',
   equip:['Diverter and lift-out','Operator screen and bins'],
   manual:'Not a manual step today',
   notes:['Three failures in a row at the same step stop the line','Long cable cut off at trim can be recycled for shorter lengths'] },

 { id:'8', num:'8', name:'Trim', g:'trim', section:'Pallet loop, east side', tag:'Cut and test to length',
   handles:'Connects the bare cable end to Baker Hughes’ test hardware and software, then cuts in small steps and tests again until the length and electrical response are right. It takes about two to three trims per cable, with about 6 s per test.',
   equip:['Trim machines built by us: feed rollers, stepper drives and cutter','Working standard, prox and probe supplied by Baker Hughes'],
   manual:'71 s for pull test and trim',
   notes:['Over-trimmed cable is scrapped or recycled','The cut resolution needed is still to be confirmed'] },
 { id:'9', num:'9', name:'Male end strip and shrink', g:'male', section:'Pallet loop, east side', tag:'Strip and place shrink',
   handles:'Strips the trimmed end and places the shrink: the color-coded piece and clear customer shrink (two or three pieces, small or large diameter depending on armor and approvals).',
   equip:['Stripper and shrink dispensers as at stations 2 and 3'],
   manual:'68 s for stations 9 to 12 together (male end)',
   notes:['The male end takes no connector protector'] },
 { id:'10', num:'10', name:'Male pin crimp', g:'male', section:'Pallet loop, east side', tag:'Male center pin',
   handles:'Crimps the male center pin (167305) onto the center conductor and checks the seating with a camera.',
   equip:['Z&F CR03-class pin crimper, male head (vendor list)','Pin bowl feeder'],
   manual:'Inside the 68 s male-end step', notes:[] },
 { id:'11', num:'11', name:'Male connector and ferrule', g:'male', section:'Pallet loop, east side', tag:'Robot: connector + ferrule',
   handles:'Same sequence as the female end with the male connector (00500126): ferrule on, braid flared, connector snapped on, ferrule slid over the braid and crimped.',
   equip:['Small 6-axis robot with braid-flare and ferrule tools','AMP-class pneumatic crimper (vendor list)'],
   manual:'Inside the 68 s male-end step', notes:[] },
 { id:'12', num:'12', name:'Male pull test', g:'male', section:'Pallet loop, east side', tag:'25 lb, second fail scraps',
   handles:'Pulls the connector to 25 lb. One failure gets a new connector and a retest. A second failure scraps the cable, because re-cutting would put the length out of spec.',
   equip:['Load-cell pull tester'],
   manual:'Inside the 68 s male-end step', notes:['Different failure path than the female end'] },
 { id:'13', num:'13', name:'Label, apply and shrink', g:'finish', section:'Pallet loop, east side', tag:'Serial and approvals labels',
   handles:'Prints the serial and approvals labels, places them under the clear shrink (on the armor for armored cable), and shrinks only the label tubes, never the customer shrink. A camera checks for folded label corners.',
   equip:['Brady BP-PR600-class printers, one per label stock: NSV 3.0 × 0.25 in, standard 3.0 × 0.40 in, armor 3.0 × 0.90 in','Heat tunnel with fume capture'],
   manual:'41 s',
   notes:['Serial numbers come from the work order through the Baker Hughes software','Labels must be UL 969 certified'] },
 { id:'14', num:'14', name:'Final test', g:'trim', section:'Pallet loop, east side', tag:'Both ends on test standard',
   handles:'Connects both connectors to the Baker Hughes final-test setup with the working standard, and records the result against the serial number.',
   equip:['Baker Hughes test hardware and software','Mating arm for both connectors'],
   manual:'44 s for final test and packing together',
   notes:['Results go to the Baker Hughes SQL server now, and to SAP-DM later'] },
 { id:'15', num:'15', name:'Caps, clamshell and pack', g:'finish', section:'Pallet loop, east side', tag:'Caps, clamshell, order cart',
   handles:'Fits blue caps (02201351) on both connectors, places the cable in the right clamshell, adds the card, protector, safety data sheet and other order items, applies the box label, and sends it to the stock or customer-order cart.',
   equip:['Pack robot','Two clamshell magazines. The armored cavity is about 11.0 × 11.1 in and the unarmored about 7.7 × 7.4 in','Cap, card and sheet feeders, plus a box label printer'],
   manual:'Inside the 44 s final test and pack step',
   notes:['Stock and customer orders are kept on separate carts'] },

 { id:'SW', num:'Spools', name:'Spool wall (start)', g:'prep', section:'x', tag:'Bulk cable by type, 1,845 ft',
   handles:'Where the line starts. Bulk cable spools of 1,845 ft (about 562 m) stand ready, one stand per cable type, so the work order picks the cable without anyone re-threading. The wall feeds both the unarmored cut-and-coil station (1) and the armor cable-stuffing machine (A3).',
   equip:['Spool stands with brake and tension control, one per cable type (six families, plus the 7200 cable and a spare)','Selector that routes the chosen cable to the cutter and sets the splice-detector bank for that type','Spool ID and lot scanned when a spool is loaded'],
   manual:'Today an operator scans the work order, checks the spool, threads the cable and sets the splice detector',
   notes:['At an assumed 7 m average cut and 600 cables a shift, that is about 4 km of cable a shift, or roughly 7 spools','An operator swaps only the spool that is running low. The other types stay loaded','Spools are loaded by an operator. The smart inventory does not store or deliver them','Spool weight is not known yet, which decides whether a lift assist is needed'] },
 { id:'UL', num:'Out', name:'Unload (finished clamshells)', g:'finish', section:'x', tag:'Stock and customer-order carts',
   handles:'End of the line. The pack robot places closed clamshells on separate carts for stock orders and customer orders, as the SOW requires. The carts sit beside the start, so one operator area covers loading spools and removing finished product.',
   equip:['Two output carts or pallet positions','Cart presence and full signals to the line'],
   manual:'Operators pack and stack by hand today',
   notes:['Cart size to match the plant’s 40 × 48 in pallets'] },
 { id:'PL', num:'Loop', name:'Pallet carriers', g:'support', section:'Support systems', tag:'18 carriers on a 72 ft loop',
   handles:'Each carrier has a winding spindle for the cable coil and two parallel grippers that hold the two cable ends. The grippers release and regrip as the station needs. One cable per carrier keeps every cable traceable.',
   equip:['Flexible pallet loop, similar in style to a Bosch Variflow system','Carrier pitch 4 ft, indexing between stations'],
   manual:'Replaces hand carrying of coils',
   notes:['Winder must handle 3 to 13.5 m of cable, and stiff armored cable','Coil must fit the clamshell cavities, so the cable and armor bend radius is needed'] },
 { id:'L', num:'WS', name:'Working standard library', g:'support', section:'Support systems', tag:'Rail robot swaps standards',
   handles:'Option 3, full automation: a library of working standards, each a prox, cable, probe and target, kept like a tool crib. A rail robot picks the right one for the work order, mounts it in the test rigs at trim and final test, re-runs the standard every two hours, and swaps in another set if a connector breaks.',
   equip:['Baker Hughes supplies the standards and test hardware. We supply the library and the handling'],
   manual:'Today an operator sets up each standard by hand',
   notes:['Options 1 (manual) and 2 (semi-automatic) are priced as lower-cost alternatives','Library size depends on how many probe types and lengths must be kept on hand'] },
 { id:'I', num:'Inv', name:'Smart inventory', g:'support', section:'Support systems', tag:'8 h of parts, refilled live',
   handles:'Bulk connectors, pins, ferrules, shrink, protectors, labels, caps and clamshells, with at least 8 hours of supply. An operator refills without pausing the line, and every container has a tracked ID with MES updates.',
   equip:['Tracked storage towers feeding the station magazines'], manual:'Operators pick parts by hand today',
   notes:['It tracks spools by scanning them in, but spools stay on the spool wall. It does not store or deliver them','Scope of the inventory system itself is still to be confirmed'] },
 { id:'X', num:'Exh', name:'Exhaust and filtration', g:'support', section:'Support systems', tag:'Armor cut and shrink fumes',
   handles:'Captures fumes and particles at armor cutting and the shrink steps, with a filter and a saturation alarm. The duct from the filter to the outside is Baker Hughes’ scope.',
   equip:['Capture hoods, fan, filter and differential-pressure gauge, with a flange for the plant duct'], manual:'None today',

var ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), downAt = null, hoverId = null;
renderer.domElement.addEventListener('pointerdown', function (e) { downAt = [e.clientX, e.clientY]; });
